rules:
  - id: aws-access-key-id
    description: AWS Access Key ID
    regex: "AKIA[0-9A-Z]{16}"
    severity: CRITICAL

  - id: aws-secret-access-key
    description: AWS Secret Access Key (heuristic)
    regex: "[A-Za-z0-9/+=]{40}"
    keywords: ["aws"]
    minEntropy: 4.5
    severity: CRITICAL

  - id: github-pat
    description: GitHub Personal Access Token
    regex: "gh[pousr]_[A-Za-z0-9]{36}"
    severity: CRITICAL

  - id: github-fine-grained-pat
    description: GitHub Fine-Grained Personal Access Token
    regex: "github_pat_[A-Za-z0-9_]{22,}"
    severity: CRITICAL

  - id: slack-token
    description: Slack Token
    regex: "xox[baprs]-[A-Za-z0-9-]{10,}"
    severity: HIGH

  - id: slack-webhook
    description: Slack Webhook URL
    regex: "https://hooks\\.slack\\.com/services/[A-Za-z0-9/]{20,}"
    severity: MEDIUM

  - id: google-api-key
    description: Google API Key
    regex: "AIza[0-9A-Za-z_-]{35}"
    severity: HIGH

  - id: stripe-key
    description: Stripe Live API Key
    regex: "[sr]k_live_[0-9a-zA-Z]{24,}"
    severity: CRITICAL

  - id: twilio-api-key
    description: Twilio API Key
    regex: "SK[0-9a-fA-F]{32}"
    severity: HIGH

  - id: npm-token
    description: npm Access Token
    regex: "npm_[A-Za-z0-9]{36}"
    severity: HIGH

  - id: private-key
    description: Private Key
    regex: "-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----"
    severity: CRITICAL

  - id: jwt
    description: JSON Web Token
    regex: "eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
    severity: MEDIUM

  - id: db-connection-string
    description: Database connection string with embedded password
    regex: "(postgres|postgresql|mysql|mongodb(\\+srv)?)://[^:\\s]+:[^@\\s]+@"
    severity: HIGH

  - id: generic-secret-assignment
    description: Generic hardcoded secret/password/token assignment
    regex: "['\"][A-Za-z0-9+/_=-]{8,}['\"]"
    keywords: ["api_key", "apikey", "secret", "password", "passwd", "token"]
    minEntropy: 3.5
    severity: LOW
