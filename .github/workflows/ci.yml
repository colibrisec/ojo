name: ci
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage report
        uses: getsentry/codecov-action@b3db4e382bd9859c913a96093a3d369b67f59177 # v0.4.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          post-pr-comment: true
      - name: Build
        run: go build ./...

  coverage-badge:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Test
        run: go test -v ./...
      - name: Update coverage report
        uses: ncruces/go-coverage-report@69fd9ab687d384cc6c78c31967e204abdfa21271 # v0.3.3
        with:
          report: true
          chart: true
          amend: true
        continue-on-error: true
