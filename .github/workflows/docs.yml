name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/pages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs-requirements.txt
      - run: mkdocs build --strict
      # colibrisec.dev is this deployment's root, and the docs live at
      # colibrisec.dev/docs/ -- nest the built site under /docs and give
      # the domain root a small redirect into it.
      - name: Assemble Pages site
        run: |
          mkdir -p _site/docs
          cp -r site/* _site/docs/
          cp .github/pages/index.html _site/index.html
          echo "colibrisec.dev" > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
