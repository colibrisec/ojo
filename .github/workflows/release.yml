name: release

# Runs on the 1st of every month and cuts a new release — major stays 0
# until ojo hits a 1.0 API-stability point. The scheduled monthly run
# bumps minor and resets patch (v0.1.5 -> v0.2.0); a workflow_dispatch run
# between monthly releases bumps only patch (v0.1.5 -> v0.1.6), same
# semver convention as a minor release vs. a patch release.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: bump
        run: |
          latest=$(git tag -l 'v0.*' | sed 's/^v0\.//' | sort -t. -k1,1n -k2,2n | tail -1)
          minor="${latest%%.*}"
          patch="${latest##*.}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            minor=$(( minor + 1 ))
            patch=0
          else
            patch=$(( patch + 1 ))
          fi
          echo "version=v0.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          name="ojo_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/colibrisec/ojo/internal/cli.Version=${VERSION}" -o "dist/${name}" .
      - uses: actions/upload-artifact@v7
        with:
          name: ojo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*

  package-linux:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: "ojo_linux_*"
          path: dist
          merge-multiple: true
      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ver="${VERSION#v}"
          mkdir -p pkg
          for arch in amd64 arm64; do
            cp "dist/ojo_${VERSION}_linux_${arch}" ./ojo
            chmod +x ./ojo
            ARCH="$arch" VERSION="$ver" nfpm package --config nfpm.yaml --packager deb --target "pkg/ojo_${ver}_linux_${arch}.deb"
            ARCH="$arch" VERSION="$ver" nfpm package --config nfpm.yaml --packager rpm --target "pkg/ojo_${ver}_linux_${arch}.rpm"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ojo-packages-linux
          path: pkg/*

  package-windows:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ojo_windows_amd64
          path: dist
      # Pinned below v6: WiX v7 gates its CLI behind accepting a paid Open
      # Source Maintenance Fee EULA for orgs over $10k/yr revenue (WIX7015)
      # -- v5.0.2 predates that and matches the wxs schema used here.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ver = $env:VERSION.TrimStart('v') + '.0'
          $exePath = (Resolve-Path "dist/ojo_${env:VERSION}_windows_amd64.exe").Path
          wix build installer/ojo.wxs -d "Version=$ver" -d "SourceFile=$exePath" -o "dist/ojo_${env:VERSION}_windows_amd64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: ojo-package-windows
          path: dist/*.msi

  release:
    needs: [version, build, package-linux, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "ojo*" # excludes docker/build-push-action's own *.dockerbuild summary artifact
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/colibrisec/ojo:${{ needs.version.outputs.version }}
            ghcr.io/colibrisec/ojo:latest

  # Pushes an updated Formula/ojo.rb to the colibrisec/homebrew-tap repo.
  # Requires a HOMEBREW_TAP_TOKEN secret (fine-grained PAT scoped to just
  # that repo, contents:read+write) — the default GITHUB_TOKEN can't push
  # to a different repo. If that secret isn't set yet, this job fails but
  # doesn't block binaries/packages/Docker, which already published above.
  homebrew:
    needs: [version, build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "ojo_darwin_*"
          path: dist
          merge-multiple: true
      - name: Update Homebrew formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ver="${VERSION#v}"
          sha_amd64=$(sha256sum "dist/ojo_${VERSION}_darwin_amd64" | cut -d' ' -f1)
          sha_arm64=$(sha256sum "dist/ojo_${VERSION}_darwin_arm64" | cut -d' ' -f1)
          cat > ojo.rb <<FORMULA
          class Ojo < Formula
            desc "Security scanner for dependencies, secrets, misconfiguration, and code"
            homepage "https://github.com/colibrisec/ojo"
            version "${ver}"
            license "GPL-2.0-only"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/colibrisec/ojo/releases/download/${VERSION}/ojo_${VERSION}_darwin_arm64"
                sha256 "${sha_arm64}"
              else
                url "https://github.com/colibrisec/ojo/releases/download/${VERSION}/ojo_${VERSION}_darwin_amd64"
                sha256 "${sha_amd64}"
              end
            end

            def install
              bin.install Dir["ojo_*"].first => "ojo"
            end

            test do
              system "#{bin}/ojo", "--version"
            end
          end
          FORMULA
      - name: Push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/colibrisec/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ojo.rb tap/Formula/ojo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ojo.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
          else
            git commit -m "ojo ${VERSION}"
            git push
          fi

  # Builds the .snap natively per architecture -- plugin: go cross-compiles
  # fine, but the go plugin's own build tooling still needs to actually run
  # on a matching host, so this uses GitHub's free hosted arm64 runner
  # rather than trying to cross-build snaps from a single amd64 host.
  package-snap:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Set snap version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version: \"0.0.0\"/version: \"${VERSION#v}\"/" snap/snapcraft.yaml
      # canonical/action-build installs and configures LXD itself (a plain
      # `sudo snap install snapcraft --classic` + `snapcraft pack` doesn't
      # work unmodified in CI: pack defaults to an LXD-isolated build and
      # fails on missing 'lxd' group membership; --destructive-mode skips
      # that but then can't install build-snaps like `go` either, since it
      # runs as a non-root user without the same LXD-container privileges).
      - id: snapcraft
        uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
      - uses: actions/upload-artifact@v7
        with:
          name: ojo-snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}

  # Publishes to the Snap Store. Requires a SNAPCRAFT_STORE_CREDENTIALS
  # secret (`snapcraft export-login` output, tied to whichever account
  # registered the ojo-scanner name) -- optional/non-blocking like Homebrew
  # and winget above.
  snap:
    needs: [version, package-snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "ojo-snap-*"
          path: dist
          merge-multiple: true
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Publish to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          for f in dist/*.snap; do
            snapcraft upload "$f" --release=stable
          done

  # Opens/updates a PR against microsoft/winget-pkgs with the new MSI.
  # Unlike the other channels this isn't self-hosted — it depends on
  # Microsoft's community repo accepting the PR (their validation bots run
  # automatically; a genuinely new package identifier may need a manual
  # look the first time). Requires a WINGET_TOKEN secret (classic or
  # fine-grained PAT with public_repo, used to fork winget-pkgs and open
  # the PR) — same "optional, doesn't block the rest" story as Homebrew.
  winget:
    needs: [version, package-windows, release]
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: colibrisec.ojo
          installers-regex: '\.msi$'
          version: ${{ needs.version.outputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}
