name: release

# Runs on the 1st of every month and cuts a new v0.0.N release (N bumps by
# 1 each run — no minor/major logic, ojo isn't at a 1.0 API-stability point
# yet). workflow_dispatch is for testing the pipeline manually without
# waiting for the schedule.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: bump
        run: |
          latest=$(git tag -l 'v0.0.*' | sed 's/^v0\.0\.//' | sort -n | tail -1)
          next=$(( ${latest:-0} + 1 ))
          echo "version=v0.0.${next}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          name="ojo_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/colibrisec/ojo/internal/cli.Version=${VERSION}" -o "dist/${name}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ojo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/colibrisec/ojo:${{ needs.version.outputs.version }}
            ghcr.io/colibrisec/ojo:latest
